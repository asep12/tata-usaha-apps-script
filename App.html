// Isian kata sandi + tombol mata untuk melihat ketikan, supaya salah ketik bisa dicek sebelum dikirim.
function isianSandi(inp) {
  var tb = h('button', { class: 'lihat-sandi', type: 'button', 'aria-label': 'Tampilkan kata sandi', 'aria-pressed': 'false', 'aria-controls': inp.id, title: 'Tampilkan kata sandi' }, ikon('mata'));

    var lihat = inp.type === 'password';
    var a = inp.selectionStart, b = inp.selectionEnd;
    inp.type = lihat ? 'text' : 'password';
    var label = lihat ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi';
    tb.setAttribute('aria-pressed', lihat ? 'true' : 'false'); tb.setAttribute('aria-label', label); tb.title = label;
    kosongkan(tb); tb.appendChild(ikon(lihat ? 'mataTutup' : 'mata'));
    inp.focus();
    try { inp.setSelectionRange(a, b); } catch (e) { /* abaikan */ }
  });
  // kembali tersembunyi saat formulir dikirim, supaya kata sandi tidak tertinggal terlihat di layar
  setTimeout(function () { if (inp.form) inp.form.addEventListener('submit', function () { if (inp.type === 'text') tb.click(); }, true); }, 0);
  return h('span', { class: 'sandi-wadah' }, inp, tb);
}

function layarMasuk(st, pesan) {

  var uSandi2 = h('input', { class: 'in', id: 'l_sandi2', type: 'password', autocomplete: 'new-password' });
  var btn = h('button', { class: 'btn utama', type: 'submit', style: 'min-height:44px' }, pertama ? 'Buat akun Admin' : 'Masuk');

  function tampilGalat(t) { galatBox.style.display = ''; galatBox.lastChild.textContent = t; }

        ? 'Aplikasi ini belum punya akun. Akun ini akan mengelola pengguna lain.'

    galatBox,
    pertama ? h('label', { class: 'f', for: 'l_nama' }, 'Nama lengkap', uNama) : null,
    h('label', { class: 'f', for: 'l_user' }, 'Nama pengguna', uUser),
    h('label', { class: 'f', for: 'l_sandi' }, 'Kata sandi', isianSandi(uSandi), pertama ? h('span', { class: 'bantu' }, 'Minimal 8 karakter.') : null),
    pertama ? h('label', { class: 'f', for: 'l_sandi2' }, 'Ulangi kata sandi', isianSandi(uSandi2)) : null,
    btn);
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();

function masukkan(b) {

  S.user = b.user; S.izin = b.izin; S.modul = b.modul; S.urutan = b.urutan; S.sekolah = b.sekolah; S.logo = b.logo; S.hariIni = b.hariIni;
  S.data = {}; S.ui = {}; janjiMuat = {}; sudahPrefetch = false;
  S.berandaCache = b.beranda ? { t: Date.now(), d: b.beranda } : null;
  simpanBoot(b);
  renderShell();
  pindah(ruteDariHash() || { n: 'beranda' }, true);
}

function ruteDariHash() {
  var h0 = ''; try { h0 = location.hash; } catch (e) { return null; }
  var m = /^#\/m\/([a-z_]+)$/.exec(h0);
  if (m && S.modul[m[1]]) return { n: 'modul', k: m[1] };
  if (h0 === '#/pengaturan' && S.user.peran === 'Admin') return { n: 'pengaturan' };
  if (h0 === '#/pengguna' && S.user.peran === 'Admin') return { n: 'pengguna' };
  if (h0 === '#/beranda') return { n: 'beranda' };
  if (h0 === '#/rekap' && (S.modul.siswa || S.modul.pegawai)) return { n: 'rekap' };
  if (h0 === '#/dampak' && (S.user.peran === 'Admin' || S.user.peran === 'Pimpinan')) return { n: 'dampak' };

}

    var m = S.modul[k]; if (!m) return;
    if (!peta[m.menu]) { peta[m.menu] = { judul: m.menu, item: [] }; grup.push(peta[m.menu]); }
    peta[m.menu].item.push({ r: { n: 'modul', k: k }, label: m.nav || m.judul, ikon: m.ikon });
  });

  if (S.modul.siswa || S.modul.pegawai) lap.item.push({ r: { n: 'rekap' }, label: 'Rekapitulasi', ikon: 'rekap' });
  var ip = grup.indexOf(peta.Pengaturan);
  if (lap.item.length) { if (ip >= 0) grup.splice(ip, 0, lap); else grup.push(lap); }

function normal(s) { return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); }

function uraiCsv(teks) {
  teks = teks.replace(/^﻿/, '');
  var baris1 = teks.split(/\r?\n/)[0] || '';
  var cnt = { ';': baris1.split(';').length, ',': baris1.split(',').length, '\t': baris1.split('\t').length };
  var p = cnt[';'] >= cnt[','] && cnt[';'] >= cnt['\t'] ? ';' : (cnt['\t'] > cnt[','] ? '\t' : ',');
  var rows = [], row = [], sel = '', q = false;
  for (var i = 0; i < teks.length; i++) {

    if (q) {
      if (c === '"') { if (teks[i + 1] === '"') { sel += '"'; i++; } else q = false; } else sel += c;
    } else if (c === '"') q = true;
    else if (c === p) { row.push(sel); sel = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && teks[i + 1] === '\n') i++; row.push(sel); sel = ''; rows.push(row); row = []; }
    else sel += c;
  }

function muatXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise(function (ok, gagal) {
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ok;
    s.onerror = function () { gagal(new Error('Pembaca Excel tidak bisa dimuat (periksa koneksi). Simpan berkas sebagai CSV lalu impor lagi.')); };
    document.head.appendChild(s);
  });
}
function bacaBerkasTabel(f) {
  return new Promise(function (ok, gagal) {
    var fr = new FileReader();
    if (/\.xlsx?$/i.test(f.name)) {
      fr.onload = function () {
        muatXlsx().then(function () {
          var wb = XLSX.read(new Uint8Array(fr.result), { type: 'array', cellDates: true });
          var ws = wb.Sheets[wb.SheetNames[0]];
          var tabel = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
          // sel tanggal Excel menjadi ISO (tanpa tebak-tebakan dd/mm vs mm/dd); angka menjadi teks
          ok(tabel.map(function (r) {
            return r.map(function (v) {
              if (Object.prototype.toString.call(v) === '[object Date]' && !isNaN(v.getTime())) return v.getFullYear() + '-' + ('0' + (v.getMonth() + 1)).slice(-2) + '-' + ('0' + v.getDate()).slice(-2);
              return typeof v === 'number' ? String(v) : v;
            });
          }));
        }).catch(gagal);
      };
      fr.onerror = function () { gagal(new Error('Berkas tidak bisa dibaca.')); };
      fr.readAsArrayBuffer(f);
    } else {
      fr.onload = function () { ok(uraiCsv(String(fr.result))); };
      fr.onerror = function () { gagal(new Error('Berkas tidak bisa dibaca.')); };
      fr.readAsText(f, 'utf-8');
    }
  });
}

function laciImpor(kunci) {
  var m = S.modul[kunci];

  var kolImpor = m.field.filter(function (f) { return !f.auto || (kunci === 'siswa' && f.k === 'no_induk'); });

  function fieldAlias(k) {
    var nyata = kolImpor.filter(function (f) { return f.k === k; })[0];
    return nyata || { k: k, l: ALIAS_MAYA[k] || k, t: 'teks', maya: true };
  }
  // cari baris judul (Dapodik biasanya punya beberapa baris judul di atas) dan petakan kolomnya
  function petakan(tabel) {
    var terbaik = null, nMax = 0, iMax = 0;
    for (var i = 0; i < Math.min(tabel.length, 25); i++) {
      var pakai = {};
      var peta = tabel[i].map(function (c) {
        var hn = normal(c); if (!hn) return null;
        var f = null;
        for (var j = 0; j < kolImpor.length; j++) if (kolImpor[j].k === hn || normal(kolImpor[j].l) === hn) f = kolImpor[j];
        if (!f && alias[hn]) f = fieldAlias(alias[hn]);
        if (!f || pakai[f.k]) return null;
        pakai[f.k] = 1; return f;
      });
      var n = peta.filter(Boolean).length;
      if (n > nMax) { nMax = n; terbaik = peta; iMax = i; }
    }
    if (!nMax) return null;
    var mulai = iMax + 1, sub = tabel[iMax + 1];
    if (sub && sub.map(normal).indexOf('tahun_lahir') >= 0 && sub.map(normal).indexOf('pekerjaan') >= 0) {
      tabel[iMax].forEach(function (c, j) {
        var g = GRUP_ORTU[normal(c)]; if (!g) return;
        for (var k = j; k < Math.min(j + 6, sub.length); k++) {
          var awalan = SUB_ORTU[normal(sub[k])]; if (!awalan) continue;
          var fk = awalan + g;
          terbaik[k] = kolImpor.filter(function (f) { return f.k === fk; })[0] || null;

      mulai = iMax + 2;

  function awal() {

    area.appendChild(tombol('Unduh templat CSV kosong', { ikon: 'unduh', klik: function () { unduh('templat-' + kunci + '.csv', kolImpor.map(function (f) { return csvSel(f.k); }).join(';') + '\r\n'); } }));
    area.appendChild(h('label', { class: 'f', for: 'berkas-csv' }, 'Berkas Excel atau CSV', file));
    area.appendChild(h('p', { class: 'bantu' }, 'Kolom yang dikenali: ' + kolImpor.map(function (f) { return f.k; }).join(', ') +
      (Object.keys(alias).length ? '. Judul kolom Dapodik yang umum (mis. NIPD, JK, Rombel Saat Ini, Sekolah Asal' + (kunci === 'pegawai' ? ', NUPTK, Jenis PTK' : '') + ') ikut dipetakan.' : '.') +
      ' Tanggal boleh 31/12/2010 atau 2010-12-31. Hanya lembar pertama yang dibaca.'));
  }
  file.addEventListener('change', function () {
    var f = file.files[0]; if (!f) return;
    if (f.size > 8 * 1024 * 1024) { toast('Berkas terlalu besar (maksimal 8 MB).', true); return; }
    bacaBerkasTabel(f).then(pratinjau).catch(function (e) { toast(pesanGalat(e), true); });
  });

  function pratinjau(tabel) {

    var peta = pt.peta;
    var rows = [];
    for (var i = pt.mulai; i < tabel.length; i++) {

      if (!r.some(function (x) { return String(x).trim() !== ''; })) continue;
      var o = { _baris: i + 1 };
      peta.forEach(function (f, j) {
        if (!f) return;
        var v = r[j] === undefined || r[j] === null ? '' : r[j];
        o[f.k] = f.t === 'tanggal' ? tanggalBebas(v) : String(v).trim();
      });
      rows.push(olahBaris(kunci, o));
    }
    if (!rows.length) { toast('Tidak ada baris data di bawah judul kolom.', true); return; }
    tgt.rows = rows;
    kosongkan(area);
    var dikenal = peta.filter(Boolean);
    area.appendChild(h('p', null, h('b', null, rows.length + ' baris'), ' siap diimpor (judul kolom di baris ' + (pt.hi + 1) + '). Kolom dikenali: ' + dikenal.map(function (f) { return f.l; }).join(', ') + '.'));
    var abaikan = tabel[pt.hi].filter(function (x, j) { return String(x).trim() && !peta[j]; });
    if (abaikan.length) area.appendChild(h('p', { class: 'bantu' }, 'Kolom tidak dipakai (' + abaikan.length + '): ' + abaikan.slice(0, 12).join(', ') + (abaikan.length > 12 ? ', dan ' + (abaikan.length - 12) + ' lainnya.' : '.')));
    var kolTampil = kolImpor.filter(function (f) { return rows.slice(0, 5).some(function (r) { return r[f.k]; }); });
    var thead = h('tr', null, kolTampil.map(function (f) { return h('th', { scope: 'col' }, f.l); }));
    var tbody = h('tbody', null, rows.slice(0, 5).map(function (r) { return h('tr', null, kolTampil.map(function (f) { return h('td', null, r[f.k] || ''); })); }));
    area.appendChild(h('div', { class: 'pratinjau' }, h('table', null, h('thead', null, thead), tbody)));
    area.appendChild(h('p', { class: 'bantu' }, 'Pratinjau 5 baris pertama. Baris yang gagal validasi dilewati dan dilaporkan.'));
    var go = tombol('Impor ' + rows.length + ' baris', { utama: true, klik: function () { jalankan(go); } });
    area.appendChild(h('div', { class: 'bar-aksi' }, go, tombol('Pilih berkas lain', { klik: awal })));
  }

  function jalankan(go) {
    var rows = tgt.rows, ok = 0, gagal = [], i = 0, UK = 100, t0 = Date.now();
    go.setAttribute('aria-busy', 'true');
    var bar = h('i', { style: 'width:0%' });

    (function lanjut() {

      var potong = rows.slice(i, i + UK);
      apiT('apiImpor', kunci, potong).then(function (r) {
        ok += r.ok; gagal = gagal.concat(r.gagal); i += UK;
        bar.style.width = Math.min(100, Math.round(i / rows.length * 100)) + '%';
        lanjut();
      }).catch(function (e) { gagal.push({ baris: potong[0]._baris + '–' + potong[potong.length - 1]._baris, alasan: pesanGalat(e) }); i += UK; lanjut(); });
    })();
    function selesai() {
      delete S.data[kunci];
      if (ok > 0) apiT('apiCatatImpor', kunci, ok, Math.round((Date.now() - t0) / 1000)).then(function () { }, function () { });
      kosongkan(area);
      area.appendChild(h('div', { class: 'hasil-pdf' }, ikon('cek'), h('span', null, ok + ' baris berhasil diimpor.')));
      if (gagal.length) {
        area.appendChild(h('p', null, h('b', null, gagal.length + ' baris dilewati:')));
        area.appendChild(h('ul', { style: 'margin:0;padding-left:20px;display:grid;gap:4px' }, gagal.slice(0, 50).map(function (g) { return h('li', null, 'Baris ' + g.baris + ': ' + g.alasan); })));
        if (gagal.length > 50) area.appendChild(h('p', { class: 'bantu' }, 'Menampilkan 50 pertama.'));
      }
      area.appendChild(tombol('Selesai', { utama: true, klik: function () { d.close(); redrawDaftar(); } }));
    }
  }
  awal();
  isiLaci(d, { judul: 'Impor ' + m.judul, badan: area });
}

function tingkatDari(r) {
  if (r.tingkat) return r.tingkat;

}
function hitungJK(rows, fn) {
  var peta = {};
  rows.forEach(function (r) {
    var k = fn(r) || '(belum diisi)';
    var p = peta[k] || (peta[k] = { L: 0, P: 0, X: 0 });
    if (r.jenis_kelamin === 'L') p.L++; else if (r.jenis_kelamin === 'P') p.P++; else p.X++;
  });
  return peta;
}
function jumlahJK(peta) {
  var t = { L: 0, P: 0, X: 0 };
  Object.keys(peta).forEach(function (k) { t.L += peta[k].L; t.P += peta[k].P; t.X += peta[k].X; });
  return t;
}
function barisJK(nama, p, tebal) { return { sel: [nama, p.L, p.P, p.L + p.P + p.X], tebal: !!tebal }; }
function tabelJK(judul, kolomPertama, peta, urut, batas) {
  var kunci = Object.keys(peta).sort(urut || function (a, b) { return a.localeCompare(b, 'id', { numeric: true }); });
  if (batas) kunci = kunci.sort(function (a, b) { var x = peta[a], y = peta[b]; return (y.L + y.P + y.X) - (x.L + x.P + x.X); }).slice(0, batas);
  var baris = kunci.map(function (k) { return barisJK(k, peta[k]); });
  baris.push(barisJK('Total', jumlahJK(peta), true));
  return { judul: judul, kolom: [kolomPertama, 'L', 'P', 'Jumlah'], baris: baris };
}
function bagianSiswa(semua, status) {
  var rows = status === 'Semua' ? semua : semua.filter(function (r) { return r.status === status; });
  var out = [];
  // per kelas, dengan jumlah tiap tingkat
  var pk = hitungJK(rows, function (r) { return r.kelas_saat_ini; });
  var tingkatKelas = {};
  rows.forEach(function (r) { tingkatKelas[r.kelas_saat_ini || '(belum diisi)'] = tingkatDari(r); });
  var grup = {};
  Object.keys(pk).forEach(function (k) { var t = tingkatKelas[k] || ''; (grup[t] = grup[t] || []).push(k); });
  var baris = [];
  Object.keys(grup).sort(function (a, b) { return (a || 'zz').localeCompare(b || 'zz', 'id', { numeric: true }); }).forEach(function (t) {
    var sub = { L: 0, P: 0, X: 0 };
    grup[t].sort(function (a, b) { return a.localeCompare(b, 'id', { numeric: true }); }).forEach(function (k) {
      baris.push(barisJK(k, pk[k])); sub.L += pk[k].L; sub.P += pk[k].P; sub.X += pk[k].X;
    });
    baris.push(barisJK(t ? 'Jumlah tingkat ' + t : 'Jumlah tanpa tingkat', sub, true));
  });
  baris.push(barisJK('Total', jumlahJK(pk), true));
  out.push({ judul: 'Per kelas', lebar: true, kolom: ['Kelas', 'L', 'P', 'Jumlah'], baris: baris });
  out.push(tabelJK('Per agama', 'Agama', hitungJK(rows, function (r) { return r.agama; })));
  out.push(tabelJK('Per status (semua siswa)', 'Status', hitungJK(semua, function (r) { return r.status; })));
  var th = String(S.hariIni).slice(0, 4);
  var masuk = semua.filter(function (r) { return String(r.tanggal_masuk).slice(0, 4) === th; }).length;
  var keluar = {};
  semua.forEach(function (r) { if (String(r.tanggal_keluar).slice(0, 4) === th && r.status && r.status !== 'Aktif') keluar[r.status] = (keluar[r.status] || 0) + 1; });
  var mut = [{ sel: ['Masuk (tanggal masuk tahun ini)', masuk], tebal: false }];
  Object.keys(keluar).sort().forEach(function (k) { mut.push({ sel: [k + ' (tanggal keluar tahun ini)', keluar[k]], tebal: false }); });
  out.push({ judul: 'Mutasi tahun ' + th, kolom: ['Jenis', 'Jumlah'], baris: mut });
  var abk = {};
  rows.forEach(function (r) { if (r.kebutuhan_khusus) abk[r.kebutuhan_khusus] = (abk[r.kebutuhan_khusus] || 0) + 1; });
  var ab = Object.keys(abk).sort().map(function (k) { return { sel: [k, abk[k]], tebal: false }; });
  if (ab.length) ab.push({ sel: ['Total', Object.keys(abk).reduce(function (a, k) { return a + abk[k]; }, 0)], tebal: true });
  else ab.push({ sel: ['Belum ada siswa berkebutuhan khusus tercatat', 0], tebal: false });

  return { rows: rows.length, bagian: out };
}
function bagianPegawai(semua, status) {
  var rows = status === 'Semua' ? semua : semua.filter(function (r) { return r.status === status; });
  var out = [];
  out.push(tabelJK('Per kategori', 'Kategori', hitungJK(rows, function (r) { return r.kategori; })));

  var t = tokenBaca();
  if (!t) { keLogin(); return; }
  var simpanan = bacaBoot(t);
  if (simpanan) {
    masukkan(simpanan);   // tampil seketika dari data tab ini
    api('apiSesi', t).then(function (b) {
      if (sidikBoot(b) !== sidikBoot(simpanan)) { masukkan(b); return; }   // ada perubahan: muat ulang tampilan
      simpanBoot(b);
      if (b.beranda) S.berandaCache = { t: Date.now(), d: b.beranda };
      if (S.rute.n === 'beranda') pindah({ n: 'beranda' }, true);
    }).catch(function () { /* sesi habis ditangani oleh api() */ });
  } else {
    tampilMuat();
    api('apiSesi', t).then(masukkan).catch(function () { tokenSimpan(null); keLogin(); });
  }
});
})();
</script>
